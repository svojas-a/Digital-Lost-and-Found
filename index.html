<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Lost & Found</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E2DDD4;
    --text: #1A1814;
    --muted: #7A756B;
    --accent: #C84B2F;
    --accent-light: #FAECEA;
    --accent-dark: #9A3420;
    --found-bg: #EAF6F0;
    --found-color: #0F6E56;
    --lost-bg: #FFF3E0;
    --lost-color: #A05A00;
    --info-bg: #EEF3FC;
    --info-color: #1A4A9C;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 20px; height: 20px; }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  header .tagline {
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: auto;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 2rem;
    box-shadow: var(--shadow);
  }

  .tab-btn {
    flex: 1;
    padding: 0.65rem 1rem;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .tab-btn:not(.active):hover { background: var(--bg); color: var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
  }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
    margin-bottom: 0.35rem;
  }

  .card-desc {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .form-grid.full { grid-template-columns: 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .field input, .field select, .field textarea {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }

  .field textarea { resize: vertical; min-height: 80px; }

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0.65rem 1.4rem;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-outline {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-outline:hover { background: var(--accent-light); }

  .btn-success { background: #0F6E56; color: #fff; }
  .btn-success:hover { background: #085041; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 1.25rem;
    align-items: center;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.5rem 0;
  }

  /* Item list */
  .item-list { display: flex; flex-direction: column; gap: 10px; }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: border-color 0.15s;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item-card:hover { border-color: #c5c0b8; }

  .item-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-found { background: var(--found-bg); color: var(--found-color); }
  .badge-lost { background: var(--lost-bg); color: var(--lost-color); }
  .badge-claimed { background: var(--info-bg); color: var(--info-color); }
  .badge-closed { background: #F0EDE8; color: var(--muted); }

  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
  .item-meta { font-size: 0.78rem; color: var(--muted); }

  .item-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-sm {
    padding: 0.35rem 0.8rem;
    font-size: 0.78rem;
    border-radius: 7px;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 1.25rem;
  }

  .search-bar input {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.65rem 1rem;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-bar input:focus { border-color: var(--accent); }

  /* Toast */
  #toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
  }

  .toast {
    background: var(--text);
    color: #fff;
    padding: 0.7rem 1.1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    animation: toastIn 0.3s ease;
    max-width: 320px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.success { background: #0F6E56; }
  .toast.error { background: #A32D2D; }
  .toast.info { background: #185FA5; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal {
    background: var(--surface);
    border-radius: 18px;
    padding: 2rem;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    animation: modalIn 0.25s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 0.3rem;
  }

  .modal p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem; }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }

  .empty-state .icon {
    font-size: 2.5rem;
    margin-bottom: 0.75rem;
    opacity: 0.4;
  }

  .empty-state p { font-size: 0.875rem; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
    .tab-btn { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="modal-overlay">
  <div class="modal">
    <h3>Welcome</h3>
    <p>Login as User or Admin</p>

    <div class="field" style="margin-bottom:12px;">
      <label>Name</label>
      <input type="text" id="login-name" placeholder="Enter name">
    </div>

    <div class="field" style="margin-bottom:12px;">
      <label>Role</label>
      <select id="login-role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <div class="field" style="margin-bottom:12px;">
      <label>Password (Admin only)</label>
      <input type="password" id="login-pass" placeholder="Enter password">
    </div>

    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn btn-primary" onclick="loginUser()">Login</button>
    </div>
  </div>
</div>

<header>
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </div>

  <h1>Digital Lost &amp; Found</h1>

  <span class="tagline" id="welcome-text">OOAD Mini Project</span>

  <button class="btn btn-outline btn-sm" onclick="logoutUser()">Logout</button>
</header>

<div class="container">

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-num" id="stat-lost">0</div>
    <div class="stat-label">Lost</div>
  </div>

  <div class="stat-card">
    <div class="stat-num" id="stat-found">0</div>
    <div class="stat-label">Found</div>
  </div>

  <div class="stat-card">
    <div class="stat-num" id="stat-claims">0</div>
    <div class="stat-label">Claims</div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">

<button class="tab-btn active" onclick="switchTab('report-lost')">
Report Lost
</button>

<button class="tab-btn" onclick="switchTab('report-found')">
Report Found
</button>

<button class="tab-btn" onclick="switchTab('search')">
Search & Claim
</button>

<button class="tab-btn" onclick="switchTab('all-items')">
All Items
</button>

<button class="tab-btn" id="adminBtn" style="display:none;" onclick="switchTab('admin', this)">
Admin
</button>

<button class="tab-btn" id="notifyBtn" style="display:none;" onclick="switchTab('notify')">
Notifications
</button>

<button class="tab-btn" id="reportBtn" style="display:none;" onclick="switchTab('reports')">
Reports
</button>

</div>

<!-- REPORT LOST -->
<div class="tab-panel active" id="tab-report-lost">
<div class="card">
<div class="card-title">Report Lost Item</div>

<div class="form-grid">
<div class="field">
<label>Item Name</label>
<input id="lost-name">
</div>

<div class="field">
<label>Category</label>
<select id="lost-category">
<option>Electronics</option>
<option>Wallet / Purse</option>
<option>Keys</option>
<option>Clothing</option>
<option>Bag / Backpack</option>
<option>Books / Documents</option>
<option>Stationery</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Location</label>
<input id="lost-location">
</div>

<div class="field">
<label>Description</label>
<input id="lost-desc">
</div>
</div>

<div class="btn-row">
<button class="btn btn-primary" onclick="submitLostItem()">Submit</button>
</div>
</div>
</div>

<!-- REPORT FOUND -->
<div class="tab-panel" id="tab-report-found">
<div class="card">
<div class="card-title">Report Found Item</div>

<div class="form-grid">
<div class="field">
<label>Item Name</label>
<input id="found-name">
</div>

<div class="field">
<label>Category</label>
<select id="found-category">
<option>Electronics</option>
<option>Wallet / Purse</option>
<option>Keys</option>
<option>Clothing</option>
<option>Bag / Backpack</option>
<option>Books / Documents</option>
<option>Stationery</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Location</label>
<input id="found-location">
</div>

<div class="field">
<label>Description</label>
<input id="found-desc">
</div>
</div>

<div class="btn-row">
<button class="btn btn-success" onclick="submitFoundItem()">Submit</button>
</div>
</div>
</div>

<!-- SEARCH -->
<div class="tab-panel" id="tab-search">
<div class="card">
<div class="card-title">Search & Claim</div>
<div id="search-results" class="item-list"></div>
</div>
</div>

<!-- ALL ITEMS -->
<div class="tab-panel" id="tab-all-items">
<div class="card">
<div class="card-title">All Items</div>
<div id="all-items-list" class="item-list"></div>
</div>
</div>

<!-- ADMIN -->
<div class="tab-panel" id="tab-admin">
<div class="card">
<div class="card-title">Admin Dashboard</div>
<div class="card-desc">Approve or Reject Claims</div>
<div id="admin-list" class="item-list"></div>
</div>
</div>

<!-- NOTIFICATIONS -->
<div class="tab-panel" id="tab-notify">
<div class="card">
<div class="card-title">Notifications</div>
<div id="notify-list" class="item-list"></div>
</div>
</div>

<!-- REPORTS -->
<div class="tab-panel" id="tab-reports">
<div class="card">
<div class="card-title">Reports</div>
<div id="report-list"></div>
</div>
</div>

</div>

<!-- CLAIM MODAL -->
<div id="claim-modal" class="modal-overlay" style="display:none;">
<div class="modal">
<h3>Claim Item</h3>

<div class="field" style="margin-bottom:12px;">
<label>Your Name</label>
<input id="claim-name">
</div>

<div class="btn-row" style="justify-content:flex-end;">
<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" onclick="submitClaim()">Submit Claim</button>
</div>
</div>
</div>

<div id="toast-container"></div>
<script>
const BASE = "http://localhost:8080";

let items = JSON.parse(localStorage.getItem("items")) || [];
let claims = JSON.parse(localStorage.getItem("claims")) || [];
let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

function saveData() {
  localStorage.setItem("items", JSON.stringify(items));
  localStorage.setItem("claims", JSON.stringify(claims));
  localStorage.setItem("notifications", JSON.stringify(notifications));
}

let currentUser = "";
let currentRole = "user";
let claimTargetId = null;

/* ---------------- LOGIN ---------------- */

function loginUser() {
  const name = document.getElementById("login-name").value.trim();
  const role = document.getElementById("login-role").value;
  const pass = document.getElementById("login-pass").value.trim();

  if (!name) {
    toast("Enter your name", "error");
    return;
  }

  if (role === "admin" && pass !== "admin123") {
    toast("Wrong admin password", "error");
    return;
  }

  currentUser = name;
  currentRole = role;

  document.getElementById("login-screen").style.display = "none";

  document.getElementById("welcome-text").textContent =
    "Welcome, " + currentUser + " (" + currentRole + ")";

  document.getElementById("notifyBtn").style.display = "flex";

  /* ADMIN LOGIN */
  if (currentRole === "admin") {

    document.getElementById("adminBtn").style.display = "flex";
    document.getElementById("reportBtn").style.display = "flex";

    /* Hide User Tabs */
    document.querySelectorAll(".tab-btn")[0].style.display = "none"; // Report Lost
    document.querySelectorAll(".tab-btn")[1].style.display = "none"; // Report Found
    document.querySelectorAll(".tab-btn")[2].style.display = "none"; // Search & Claim

    switchTab("admin");
  }

  /* NORMAL USER LOGIN */
  else {

    document.getElementById("adminBtn").style.display = "none";
    document.getElementById("reportBtn").style.display = "none";

    switchTab("report-lost");
  }

 toast("Login successful", "success");

/* Reload all saved data to screen */
renderAll();
renderSearch();
loadClaims();
loadNotify();
loadReport();
updateStats();
}

function logoutUser() {
  location.reload();
}

/* ---------------- TABS ---------------- */

function switchTab(tab, btn) {

  document.querySelectorAll(".tab-btn")
    .forEach(b => b.classList.remove("active"));

  document.querySelectorAll(".tab-panel")
    .forEach(p => p.classList.remove("active"));

  const panel = document.getElementById("tab-" + tab);
  if (panel) panel.classList.add("active");

  if (btn) btn.classList.add("active");

  if (tab === "search") renderSearch();
  if (tab === "all-items") renderAll();
  if (tab === "admin") loadClaims();
  if (tab === "notify") loadNotify();
  if (tab === "reports") loadReport();
}

/* ---------------- TOAST ---------------- */

function toast(msg, type = "info") {
  const c = document.getElementById("toast-container");

  const t = document.createElement("div");
  t.className = "toast " + type;
  t.innerHTML = msg;

  c.appendChild(t);

  setTimeout(() => {
    t.remove();
  }, 3000);
}

/* ---------------- STATS ---------------- */

function updateStats() {
  document.getElementById("stat-lost").textContent =
    items.filter(i => i.type === "lost").length;

  document.getElementById("stat-found").textContent =
    items.filter(i => i.type === "found").length;

  document.getElementById("stat-claims").textContent = claims.length;
}

/* ---------------- LOST ITEM ---------------- */

async function submitLostItem() {
  const name = document.getElementById("lost-name").value.trim();
  const cat = document.getElementById("lost-category").value;
  const loc = document.getElementById("lost-location").value.trim();
  const desc = document.getElementById("lost-desc").value.trim();

  if (!name) {
    toast("Enter item name", "error");
    return;
  }

  const payload = `${name}|${cat}|${currentUser}|${loc}|${desc}`;

  try {
    await fetch(BASE + "/reportLost", {
      method: "POST",
      body: payload
    });
  } catch (e) {}

  items.push({
    id: Date.now(),
    type: "lost",
    name,
    category: cat,
    person: currentUser,
    location: loc,
    description: desc,
    status: "open",
    date: new Date().toLocaleDateString()
  });

  notifications.push("Lost item reported: " + name);
  saveData();

  toast("Lost item submitted", "success");
  updateStats();
  loadNotify();
}

/* ---------------- FOUND ITEM ---------------- */

async function submitFoundItem() {
  const name = document.getElementById("found-name").value.trim();
  const cat = document.getElementById("found-category").value;
  const loc = document.getElementById("found-location").value.trim();
  const desc = document.getElementById("found-desc").value.trim();

  if (!name) {
    toast("Enter item name", "error");
    return;
  }

  const payload = `${name}|${cat}|${currentUser}|${loc}|${desc}`;

  try {
    await fetch(BASE + "/reportFound", {
      method: "POST",
      body: payload
    });
  } catch (e) {}

  items.push({
    id: Date.now(),
    type: "found",
    name,
    category: cat,
    person: currentUser,
    location: loc,
    description: desc,
    status: "open",
    date: new Date().toLocaleDateString()
  });

  notifications.push("Found item reported: " + name);
  saveData();

  toast("Found item submitted", "success");
  updateStats();
  loadNotify();
}

/* ---------------- SEARCH ---------------- */

function renderSearch() {

  const list = document.getElementById("search-results");

  const foundItems = items.filter(i => i.type === "found");

  if (!foundItems.length) {
    list.innerHTML = "No found items";
    return;
  }

  list.innerHTML = foundItems.map(i => {

    /* Check if current user has reported same item as lost */
    const userLost = items.find(l =>
      l.type === "lost" &&
      l.person === currentUser &&
      l.name.toLowerCase() === i.name.toLowerCase()
    );

    /* Claim allowed only if:
       1. Current user lost same item
       2. Current user is NOT finder
       3. Item still open
    */
    const canClaim =
      userLost &&
      i.person !== currentUser &&
      i.status === "open";

    return `
      <div class="item-card">

        <span class="item-badge badge-found">
          Found
        </span>

        <div class="item-info">

          <div class="item-name">
            ${i.name}
          </div>

          <div class="item-meta">
            ${i.category} · ${i.location} · ${i.person}
          </div>

        </div>

        <div class="item-actions">

          ${
            canClaim
            ? `<button class="btn btn-primary btn-sm"
                 onclick="openClaimModal(${i.id})">
                 Claim
               </button>`

            : i.person === currentUser
              ? `<span class="item-badge badge-claimed">
                   Your Found Item
                 </span>`

              : i.status !== "open"
                ? `<span class="item-badge badge-claimed">
                     ${i.status}
                   </span>`

                : `<span class="item-badge badge-claimed">
                     No Matching Lost Report
                   </span>`
          }

        </div>

      </div>
    `;

  }).join("");
}

/* ---------------- ALL ITEMS ---------------- */

function renderAll() {
  const list = document.getElementById("all-items-list");

  if (!items.length) {
    list.innerHTML = "No items";
    return;
  }

  list.innerHTML = [...items].reverse().map(i => `
    <div class="item-card">
      <span class="item-badge ${i.type === "lost" ? "badge-lost" : "badge-found"}">
        ${i.type}
      </span>

      <div class="item-info">
        <div class="item-name">${i.name}</div>
        <div class="item-meta">${i.location} · ${i.person}</div>
      </div>

      <span class="item-badge badge-claimed">${i.status}</span>
    </div>
  `).join("");
}

/* ---------------- CLAIM ---------------- */

function openClaimModal(id) {
  claimTargetId = id;
  document.getElementById("claim-modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("claim-modal").style.display = "none";
  document.getElementById("claim-name").value="";
}

async function submitClaim() {

  if (!claimTargetId) {
    toast("No item selected", "error");
    return;
  }

  const item = items.find(i => i.id === claimTargetId);

  if (!item) {
    toast("Item not found", "error");
    return;
  }

  item.status = "pending";

  claims.push({
    id: Date.now(),
    itemId: item.id,
    itemName: item.name,
    user: currentUser,
    status: "pending",
    proof: "Ownership proof"
  });

  notifications.push(
    "Admin: New claim submitted for " + item.name
  );

  saveData();

  closeModal();

  toast("Claim submitted", "success");

  renderAll();
  renderSearch();
  loadClaims();
  loadNotify();
  updateStats();
}
/* ---------------- ADMIN ---------------- */

function loadClaims() {

  const box = document.getElementById("admin-list");

  const pending = claims.filter(c => c.status === "pending");

  if (pending.length === 0) {
    box.innerHTML = `<p>No pending claims</p>`;
    return;
  }

  box.innerHTML = pending.map(c => {

    /* Find claimed FOUND item */
    const found = items.find(i =>
      i.id == c.itemId && i.type === "found"
    );

    if (!found) return "";

    /* Find matching LOST item */
    const lost = items.find(i =>
      i.type === "lost" &&
      i.name.toLowerCase() === found.name.toLowerCase()
    );

    return `
      <div class="item-card">

        <h3 style="margin-bottom:15px;">
          ${found.name}
        </h3>

        <div style="display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:18px;">

          <div style="padding:12px;border:1px solid #ddd;border-radius:12px;">
            <b>LOST REPORT</b><br><br>
            By: ${lost ? lost.person : "-"}<br>
            Location: ${lost ? lost.location : "-"}<br>
            Description: ${lost ? lost.description : "-"}
          </div>

          <div style="padding:12px;border:1px solid #ddd;border-radius:12px;">
            <b>FOUND REPORT</b><br><br>
            By: ${found.person}<br>
            Location: ${found.location}<br>
            Description: ${found.description || "-"}
          </div>

        </div>

        <div style="margin-top:18px;padding:12px;border:1px solid #ddd;border-radius:12px;">
          <b>CLAIM REQUEST</b><br><br>
          Claimed By: ${c.user}<br>
          Proof: ${c.proof || "No proof given"}
        </div>

        <div style="margin-top:18px;">
          <button class="btn btn-success"
            onclick="approveClaim(${c.id})">
            Approve
          </button>

          <button class="btn btn-outline"
            onclick="rejectClaim(${c.id})">
            Reject
          </button>
        </div>

      </div>
    `;

  }).join("");
}
function approveClaim(id) {
  const c = claims.find(x => x.id === id);
  if (!c) return;

  c.status = "approved";

  const item = items.find(i => i.id === c.itemId);
  if (item) item.status = "closed";

  notifications.push("Claim approved for " + c.itemName);
  saveData();

  toast("Claim Approved", "success");

  loadClaims();
  loadNotify();
  renderSearch();
  renderAll();
  loadReport();
  updateStats();
}

function rejectClaim(id) {
  const c = claims.find(x => x.id === id);
  if (!c) return;

  c.status = "rejected";

  const item = items.find(i => i.id === c.itemId);
  if (item) item.status = "open";

  notifications.push("Claim rejected for " + c.itemName);
  saveData();

  toast("Claim Rejected", "error");

  loadClaims();
  loadNotify();
  renderSearch();
  renderAll();
  loadReport();
  updateStats();
}

/* ---------------- NOTIFICATIONS ---------------- */

function loadNotify() {
  const list = document.getElementById("notify-list");

  if (!notifications.length) {
    list.innerHTML = "No notifications";
    return;
  }

  list.innerHTML = [...notifications].reverse().map(n => `
    <div class="item-card">
      <div class="item-info">🔔 ${n}</div>
    </div>
  `).join("");
}

/* ---------------- REPORTS ---------------- */

function loadReport() {
  const div = document.getElementById("report-list");

  const closed = items.filter(i => i.status === "closed").length;
  const approved = claims.filter(c => c.status === "approved").length;
  const rejected = claims.filter(c => c.status === "rejected").length;

  div.innerHTML = `
    <div class="item-card"><b>Total Lost:</b> ${items.filter(i=>i.type==="lost").length}</div>
    <div class="item-card"><b>Total Found:</b> ${items.filter(i=>i.type==="found").length}</div>
    <div class="item-card"><b>Total Claims:</b> ${claims.length}</div>
    <div class="item-card"><b>Approved:</b> ${approved}</div>
    <div class="item-card"><b>Rejected:</b> ${rejected}</div>
    <div class="item-card"><b>Closed Cases:</b> ${closed}</div>
  `;
}

/* ---------------- MODAL CLICK CLOSE ---------------- */

document.getElementById("claim-modal").addEventListener("click", function(e){
  if(e.target === this) closeModal();
});
</script>

</body>
</html>
